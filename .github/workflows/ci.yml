name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      # macOS ships libsqlite3 with the system
      - name: Install libsqlite3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install libsqlite3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows-static
          echo "SQLITE_PREFIX=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: epm install

      # the ecotest runner with the line and branch gates; coverage is not measured on Windows
      - name: Test
        if: runner.os != 'Windows'
        run: epm run ecotest --style simple --coverage --min-coverage 100 --min-branch-coverage 100

      # ecotest does not pass --link through, so Windows runs the same tests through echoc
      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: echoc test --link "search:$env:SQLITE_PREFIX\lib"
